[platformio]
default_envs = runtime-route-b-spike
src_dir = main

[env:runtime-route-b-spike]
; Issue #45/#52 production-shaped Route-B build proof only. This still does not
; replace or activate the native idf.py production motor owner.
platform = https://github.com/pioarduino/platform-espressif32.git#fabd8cd10c7f05672832b405dea91d38b6e6e8a0
board = esp32dev

; Proven Route-B dual-framework line: existing ESP-IDF component graph plus
; pinned Arduino-ESP32 4.0.0-RC1 on ESP-IDF 6.1.
framework = espidf, arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#76f683d935b390f2805301ec10a5562bbbb37811

; Keep the existing flash layout for build parity with the native project.
board_build.partitions = partitions.csv

; SimpleFOC v2.4.0 remains pinned to the exact reviewed release commit.
lib_deps =
    https://github.com/simplefoc/Arduino-FOC.git#4f072b365f6e0185adca544071e595834405babc

; SimpleFOC v2.4.0's legacy ESP32 MCPWM path depends on ESP-IDF 5.x private
; internals that changed in IDF 6.1. Use the library-supported LEDC backend and
; do not carry copied private Espressif structures.
;
; TRIWHIRL_ROUTE_B_SIMPLEFOC_BACKEND activates the production-shaped backend
; component only in this Route-B graph. Native idf.py builds see the same
; component as inert and remain independent of Arduino/SimpleFOC.
;
; PlatformIO's library dependency finder compiles Arduino-FOC, but ESP-IDF
; components are compiled by the IDF CMake graph and do not inherit PIO library
; include paths automatically. Expose the pinned library API plus the exact
; Arduino core, generic ESP32 board variant and Wire headers needed by the
; production-shaped backend. The esp32dev board uses Arduino's `esp32` variant,
; whose pinned `pins_arduino.h` lives under variants/esp32.
;
; TRIWHIRL_ROUTE_B_SIMPLEFOC_LINK_PROBE retains one never-called function that
; instantiates the backend + MotorControl + MotorExecutionDomain + task contract
; without begin(), I2C access, PWM enable, or task creation.
build_flags =
    -I.pio/libdeps/runtime-route-b-spike/Arduino-FOC/src
    -I"${platformio.packages_dir}/framework-arduinoespressif32/cores/esp32"
    -I"${platformio.packages_dir}/framework-arduinoespressif32/variants/esp32"
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/Wire/src"
    -DSIMPLEFOC_ESP32_USELEDC
    -DTRIWHIRL_ROUTE_B_SIMPLEFOC_BACKEND=1
    -DTRIWHIRL_ROUTE_B_SIMPLEFOC_LINK_PROBE=1
    -Wl,-u,triwhirl_route_b_simplefoc_link_probe

; No upload target is part of this gate. A successful build proves component and
; symbol integration only; it authorizes no hardware use.

[env:simplefoc-sensor-commissioning]
; Issue #82 passive hardware profile. This environment is intentionally
; separate from the default inactive Route-B proof and from native idf.py.
platform = https://github.com/pioarduino/platform-espressif32.git#fabd8cd10c7f05672832b405dea91d38b6e6e8a0
board = esp32dev
framework = espidf, arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#76f683d935b390f2805301ec10a5562bbbb37811
board_build.partitions = partitions.csv

; Select the minimal CMake graph before ESP-IDF component registration. The
; resulting main component contains only the dedicated commissioning app entry
; and passive sensor service; native motor/IMU/BLE/runtime sources are excluded.
board_build.cmake_extra_args =
    -DTRIWHIRL_ROUTE_B_SENSOR_COMMISSIONING=ON

lib_deps =
    https://github.com/simplefoc/Arduino-FOC.git#4f072b365f6e0185adca544071e595834405babc

build_flags =
    -I.pio/libdeps/simplefoc-sensor-commissioning/Arduino-FOC/src
    -I"${platformio.packages_dir}/framework-arduinoespressif32/cores/esp32"
    -I"${platformio.packages_dir}/framework-arduinoespressif32/variants/esp32"
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/Wire/src"
    -DSIMPLEFOC_ESP32_USELEDC
    -DTRIWHIRL_ROUTE_B_SIMPLEFOC_BACKEND=1
    -DTRIWHIRL_ROUTE_B_SENSOR_COMMISSIONING=1

; UART0 commissioning telemetry uses the normal ESP-IDF console.
monitor_speed = 115200

; This environment is flashable with:
;   pio run -e simplefoc-sensor-commissioning -t upload
; It does not initialize any motor driver, PWM, BLDCMotor or FOC path.
