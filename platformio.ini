[platformio]
default_envs = esp32_motor_bringup
src_dir = firmware/esp32/src
include_dir = firmware/esp32/include
test_dir = test

[env:esp32_motor_bringup]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    askuric/Simple FOC@2.4.0
build_flags =
    -DTRIWHIRL_MOTOR_BRINGUP=1
    -Wall
    -Wextra
