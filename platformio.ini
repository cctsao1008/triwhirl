[platformio]
default_envs = runtime-route-b-spike
src_dir = main

[env:runtime-route-b-spike]
; Issue #45 build-system spike only.  This does not replace the native idf.py
; production build yet.
platform = https://github.com/pioarduino/platform-espressif32.git#fabd8cd10c7f05672832b405dea91d38b6e6e8a0
board = esp32dev

; Hypothesis under test: the pinned pioarduino IDF-6 line can host the existing
; ESP-IDF component graph while also making Arduino/SimpleFOC available.
framework = espidf, arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#76f683d935b390f2805301ec10a5562bbbb37811

; Keep the existing flash layout for build parity with the native project.
board_build.partitions = partitions.csv

; Same SimpleFOC release pin and IDF-6 backend decision already proven by #39.
lib_deps =
    https://github.com/simplefoc/Arduino-FOC.git#4f072b365f6e0185adca544071e595834405babc

build_flags =
    -DSIMPLEFOC_ESP32_USELEDC

; No upload target is part of this spike.  A successful build proves only that
; the build systems/component graph can coexist; it authorizes no hardware use.
