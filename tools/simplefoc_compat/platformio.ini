[platformio]
src_dir = main

[env:esp32-arduino4-idf61]
platform = https://github.com/pioarduino/platform-espressif32.git#fabd8cd10c7f05672832b405dea91d38b6e6e8a0
framework = arduino
board = esp32dev

; Route B: deliberately exercise Arduino-ESP32 4.0.0-RC1 on ESP-IDF 6.1.
; Keep the platform and framework pinned even though this is a bleeding-edge stack.
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#76f683d935b390f2805301ec10a5562bbbb37811

; Latest stable SimpleFOC as of 2026-10-01, pinned to the v2.4.0 release commit.
lib_deps =
    https://github.com/simplefoc/Arduino-FOC.git#4f072b365f6e0185adca544071e595834405babc

; SimpleFOC v2.4.0's ESP32 MCPWM current-sense backend copies ESP-IDF 5.x
; private MCPWM structs. ESP-IDF 6.1 changed that private ABI, so use the
; library's supported LEDC backend instead of carrying a local copy/patch of
; Espressif private structures. This still leaves FOC, PWM and velocity control
; under SimpleFOC ownership. Revisit MCPWM only when upstream has IDF-6 support
; or a separately reviewed compatibility layer is justified.
build_flags =
    -DSIMPLEFOC_ESP32_USELEDC

monitor_speed = 115200
