name: Route-B runtime spike

on:
  push:
    branches:
      - simplefoc-runtime-spike
    paths:
      - '.github/workflows/runtime-route-b-spike.yml'
      - 'platformio.ini'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults'
      - 'partitions.csv'
      - 'main/**'
      - 'components/**'
  pull_request:
    paths:
      - '.github/workflows/runtime-route-b-spike.yml'
      - 'platformio.ini'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults'
      - 'partitions.csv'
      - 'main/**'
      - 'components/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned pioarduino core
        shell: bash
        run: |
          python3 -m venv "$HOME/.platformio/penv"
          "$HOME/.platformio/penv/bin/python" -m pip install --upgrade pip
          "$HOME/.platformio/penv/bin/python" -m pip install \
            "pioarduino==6.2.0" \
            "uv"
          "$HOME/.platformio/penv/bin/pio" --version

      - name: Build existing runtime graph with Route-B dual framework
        shell: bash
        run: |
          export PATH="$HOME/.platformio/penv/bin:$PATH"
          export UV_CACHE_DIR="${RUNNER_TEMP}/pioarduino-uv-cache"
          mkdir -p "$UV_CACHE_DIR"
          pio run -e runtime-route-b-spike
