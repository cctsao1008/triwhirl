name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host math tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Ilib/triwhirl_core/src \
            lib/triwhirl_core/src/three_phase_field.cpp \
            test/test_three_phase_field.cpp \
            -o /tmp/test_three_phase_field
          /tmp/test_three_phase_field

          g++ -std=c++11 -Wall -Wextra -Werror \
            -Ilib/triwhirl_core/src \
            lib/triwhirl_core/src/wheel_kinematics.cpp \
            test/test_wheel_kinematics.cpp \
            -o /tmp/test_wheel_kinematics
          /tmp/test_wheel_kinematics

  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build ESP32 motor bring-up firmware
        run: pio run -e esp32_motor_bringup
