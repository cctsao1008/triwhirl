name: CI

on:
  push:
  pull_request:

jobs:
  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "guard: runtime architecture contract"
        run: python tools/tests/runtime_architecture_contract.py
      - name: "test: host toolbox routing"
        run: |
          python tools/twtool.py --help
          python tools/twtool.py --list
          python -m tools.triwhirl_tool --list
          python tools/twtool.py help log status
          python tools/twtool.py help log prepare
          python tools/twtool.py help log start
          python tools/twtool.py help log critical
          python tools/twtool.py help log stop
          python tools/twtool.py help log session
          python tools/twtool.py help log inspect
          python tools/twtool.py help diag timing
          python tools/twtool.py help diag timing-reset
          python tools/twtool.py help diag timing-test
          python tools/twtool.py help diag imu
          python tools/twtool.py help id swing
          python -m tools.triwhirl_tool help log decode
          python -m compileall -q tools/triwhirl_tool model tools/synthesis/hinf
      - name: "test: native TWLG tools"
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          header = struct.Struct("<IHHHHIIIII8I")
          record = struct.Struct("<IfffffIHH")
          payload = b"".join(
              (
                  record.pack(1000, 0.1, 0.2, -0.3, 0.4, 1.0, 0, 0x000F, 123),
                  record.pack(2050, 0.2, 0.3, -0.4, -0.5, 0.9, 0, 0x000F, 124),
              )
          )
          crc = zlib.crc32(payload) & 0xFFFFFFFF
          magic = struct.unpack("<I", b"TWLG")[0]
          blob = header.pack(
              magic, 1, 64, 32, 1000, 2, len(payload), 0, crc, 1,
              4096, 8192, 0, 0, 0, 0, 0, 0,
          ) + payload
          Path("/tmp/twtool-test.twlog").write_bytes(blob)
          PY
          python tools/twtool.py log inspect /tmp/twtool-test.twlog --json
          python - <<'PY'
          from pathlib import Path
          from tools.triwhirl_tool import twlog

          _, payload = twlog.read(Path("/tmp/twtool-test.twlog"))
          stats = twlog.summarize(payload)
          assert stats.dt_min_us == 1050
          assert stats.dt_max_us == 1050
          assert stats.dt_mean_us == 1050.0
          assert stats.encoder_valid_records == 2
          assert stats.wheel_rate_valid_records == 2
          assert stats.imu_valid_records == 2
          assert stats.attitude_valid_records == 2
          PY
          python -m tools.triwhirl_tool log decode /tmp/twtool-test.twlog -o /tmp/twtool-test.csv
          test -s /tmp/twtool-test.csv
      - name: "test: swing TWLG extraction"
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import struct
          import zlib
          from tools.triwhirl_tool.swing_log import write_fit_csv

          header = struct.Struct("<IHHHHIIIII8I")
          record = struct.Struct("<IfffffIHH")
          normal = 0x400F
          probe_a = 0x660F
          payload = b"".join((
              record.pack(1000, 1.10, 0.5, 2.0, -0.55, 1.0, 0, normal, 100),
              record.pack(2000, 1.12, 0.6, 2.1, -0.55, 1.0, 0, probe_a, 101),
              record.pack(3000, 1.14, 0.7, 2.2, -0.55, 1.0, 0, probe_a, 102),
              record.pack(4000, 1.16, 0.8, 2.3, -0.55, 1.0, 0, probe_a, 103),
              record.pack(5000, 1.20, 0.9, 2.4, -0.40, 1.0, 0, normal, 104),
          ))
          crc = zlib.crc32(payload) & 0xFFFFFFFF
          magic = struct.unpack("<I", b"TWLG")[0]
          blob = header.pack(
              magic, 1, 64, 32, 1000, 5, len(payload), 0, crc, 1,
              4096, 8192, 0, 0, 0, 0, 0, 0,
          ) + payload
          source = Path("/tmp/swing-test.twlog")
          output = Path("/tmp/swing-test-active.csv")
          source.write_bytes(blob)
          assert write_fit_csv(source, output, vertex_a_deg=68.0) == 1
          rows = list(csv.DictReader(output.open(encoding="utf-8")))
          assert len(rows) == 4
          assert rows[0]["phase"] == "armed"
          assert all(row["vertex_id"] == "A" for row in rows)
          assert [row["phase"] for row in rows[1:]] == ["active", "active", "active"]
          assert all(abs(float(row["planned_vq_v"]) + 0.55) < 1e-6 for row in rows)
          PY
      - name: "test: independent swing probe scheduler"
        run: |
          g++ -std=c++17 \
            -Icomponents/triwhirl_core/include \
            tools/tests/swing_id_probe_schedule_test.cpp \
            components/triwhirl_core/swing_id.cpp \
            -o /tmp/swing-id-probe-schedule-test
          /tmp/swing-id-probe-schedule-test
      - name: "test: 120-degree upright geometry"
        run: |
          g++ -std=c++17 \
            -Icomponents/triwhirl_core/include \
            tools/tests/upright_geometry_test.cpp \
            -o /tmp/upright-geometry-test
          /tmp/upright-geometry-test
      - name: "build: native ESP-IDF"
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32
          path: .
