name: Standup SITL

on:
  push:
    paths:
      - "components/triwhirl_core/**"
      - "main/runtime_standup.cpp"
      - "tools/sitl/**"
      - "tools/visualization/triwhirl-sim-viewer/**"
      - ".github/workflows/sitl.yml"
  pull_request:
    paths:
      - "components/triwhirl_core/**"
      - "main/runtime_standup.cpp"
      - "tools/sitl/**"
      - "tools/visualization/triwhirl-sim-viewer/**"
      - ".github/workflows/sitl.yml"

jobs:
  deterministic-standup-sitl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native SITL
        run: |
          cmake -S tools/sitl -B /tmp/triwhirl-sitl-build
          cmake --build /tmp/triwhirl-sitl-build --config Release
      - name: Run invariant and long-run closed-loop gates
        run: /tmp/triwhirl-sitl-build/triwhirl-standup-sitl --self-test
      - name: Generate 10-second balance evidence
        run: |
          /tmp/triwhirl-sitl-build/triwhirl-standup-sitl \
            --scenario balance-demo \
            --profile nominal \
            --duration-ms 10000 \
            --require-balance-gate \
            --output /tmp/triwhirl-balance-demo.csv
          test -s /tmp/triwhirl-balance-demo.csv
          head -n 3 /tmp/triwhirl-balance-demo.csv
          tail -n 3 /tmp/triwhirl-balance-demo.csv
      - name: Check WebUI bridge syntax
        run: |
          python -m py_compile tools/visualization/triwhirl-sim-viewer/serve_live.py
          python tools/visualization/triwhirl-sim-viewer/serve_live.py --help >/dev/null
