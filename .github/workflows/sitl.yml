name: Standup SITL

on:
  push:
    paths:
      - "components/triwhirl_core/**"
      - "main/runtime_standup.cpp"
      - "tools/sitl/**"
      - "tools/visualization/triwhirl-sim-viewer/**"
      - ".github/workflows/sitl.yml"
  pull_request:
    paths:
      - "components/triwhirl_core/**"
      - "main/runtime_standup.cpp"
      - "tools/sitl/**"
      - "tools/visualization/triwhirl-sim-viewer/**"
      - ".github/workflows/sitl.yml"

jobs:
  deterministic-standup-sitl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native SITL
        run: |
          cmake -S tools/sitl -B /tmp/triwhirl-sitl-build
          cmake --build /tmp/triwhirl-sitl-build --config Release
      - name: Run invariant and long-run closed-loop gates
        run: /tmp/triwhirl-sitl-build/triwhirl-standup-sitl --self-test
      - name: Generate 10-second balance evidence
        run: |
          /tmp/triwhirl-sitl-build/triwhirl-standup-sitl \
            --scenario balance-demo \
            --profile nominal \
            --duration-ms 10000 \
            --require-balance-gate \
            --output /tmp/triwhirl-balance-demo.csv
          test -s /tmp/triwhirl-balance-demo.csv
          head -n 3 /tmp/triwhirl-balance-demo.csv
          tail -n 3 /tmp/triwhirl-balance-demo.csv
      - name: Check WebUI source and bridge
        run: |
          python -m py_compile tools/visualization/triwhirl-sim-viewer/serve_live.py
          node --check tools/visualization/triwhirl-sim-viewer/app.js
          python tools/visualization/triwhirl-sim-viewer/serve_live.py \
            --host 127.0.0.1 \
            --port 8765 \
            --exe /tmp/triwhirl-sitl-build/triwhirl-standup-sitl \
            >/tmp/triwhirl-viewer.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health >/tmp/triwhirl-health.json; then
              break
            fi
            sleep 0.1
          done
          grep '"ok": true' /tmp/triwhirl-health.json
          curl -fsSN --max-time 5 \
            'http://127.0.0.1:8765/api/live?profile=nominal&speed=10&fps=120' \
            >/tmp/triwhirl-viewer.sse
          grep 'event: meta' /tmp/triwhirl-viewer.sse
          grep 'event: sample' /tmp/triwhirl-viewer.sse
          grep 'event: end' /tmp/triwhirl-viewer.sse
          grep '"gate_pass":true' /tmp/triwhirl-viewer.sse
