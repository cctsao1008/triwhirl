name: SimpleFOC compatibility

on:
  push:
    branches:
      - simplefoc-restoration
    paths:
      - '.github/workflows/simplefoc-compat.yml'
      - 'tools/simplefoc_compat/**'
  pull_request:
    paths:
      - '.github/workflows/simplefoc-compat.yml'
      - 'tools/simplefoc_compat/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pioarduino-compatible PlatformIO core
        shell: bash
        run: |
          curl -fsSL -o /tmp/get-platformio.py \
            https://raw.githubusercontent.com/pioarduino/pioarduino-core-installer/pioarduino/get-platformio.py
          python3 /tmp/get-platformio.py
          "$HOME/.platformio/penv/bin/pio" --version

      - name: Build Arduino-ESP32 4.0.0-RC1 / IDF 6.1 / SimpleFOC 2.4.0 probe
        shell: bash
        run: |
          "$HOME/.platformio/penv/bin/pio" run -d tools/simplefoc_compat
