name: MotorControl contract

on:
  push:
    paths:
      - '.github/workflows/motor-control-contract.yml'
      - 'components/triwhirl_core/include/triwhirl/motor_control.hpp'
      - 'components/triwhirl_core/include/triwhirl/motor_mailbox.hpp'
      - 'components/triwhirl_core/include/triwhirl/motor_execution.hpp'
      - 'components/triwhirl_core/include/triwhirl/motor_execution_timing.hpp'
      - 'components/triwhirl_simplefoc/include/triwhirl/simplefoc_motor_backend.hpp'
      - 'main/runtime_motor_task.hpp'
      - 'main/runtime_motor_task.cpp'
      - 'main/runtime_motor_mailbox_compile_probe.cpp'
      - 'tools/tests/motor_control_adapter_test.cpp'
      - 'tools/tests/motor_mailbox_test.cpp'
      - 'tools/tests/motor_execution_test.cpp'
      - 'tools/tests/motor_execution_timing_test.cpp'
      - 'tools/tests/simplefoc_backend_config_test.cpp'
  pull_request:
    paths:
      - '.github/workflows/motor-control-contract.yml'
      - 'components/triwhirl_core/include/triwhirl/motor_control.hpp'
      - 'components/triwhirl_core/include/triwhirl/motor_mailbox.hpp'
      - 'components/triwhirl_core/include/triwhirl/motor_execution.hpp'
      - 'components/triwhirl_core/include/triwhirl/motor_execution_timing.hpp'
      - 'components/triwhirl_simplefoc/include/triwhirl/simplefoc_motor_backend.hpp'
      - 'main/runtime_motor_task.hpp'
      - 'main/runtime_motor_task.cpp'
      - 'main/runtime_motor_mailbox_compile_probe.cpp'
      - 'tools/tests/motor_control_adapter_test.cpp'
      - 'tools/tests/motor_mailbox_test.cpp'
      - 'tools/tests/motor_execution_test.cpp'
      - 'tools/tests/motor_execution_timing_test.cpp'
      - 'tools/tests/simplefoc_backend_config_test.cpp'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run MotorControl boundary test
        shell: bash
        run: |
          g++ -std=c++17 \
            -Icomponents/triwhirl_core/include \
            tools/tests/motor_control_adapter_test.cpp \
            -o /tmp/motor-control-adapter-test
          /tmp/motor-control-adapter-test

      - name: Build and run motor mailbox coherence test
        shell: bash
        run: |
          g++ -std=c++17 -pthread \
            -Icomponents/triwhirl_core/include \
            tools/tests/motor_mailbox_test.cpp \
            -o /tmp/motor-mailbox-test
          /tmp/motor-mailbox-test

      - name: Build and run motor execution-domain test
        shell: bash
        run: |
          g++ -std=c++17 \
            -Icomponents/triwhirl_core/include \
            tools/tests/motor_execution_test.cpp \
            -o /tmp/motor-execution-test
          /tmp/motor-execution-test

      - name: Build and run motor execution timing test
        shell: bash
        run: |
          g++ -std=c++17 -pthread \
            -Icomponents/triwhirl_core/include \
            tools/tests/motor_execution_timing_test.cpp \
            -o /tmp/motor-execution-timing-test
          /tmp/motor-execution-timing-test

      - name: Build and run SimpleFOC backend configuration test
        shell: bash
        run: |
          g++ -std=c++17 \
            -Icomponents/triwhirl_core/include \
            -Icomponents/triwhirl_simplefoc/include \
            tools/tests/simplefoc_backend_config_test.cpp \
            -o /tmp/simplefoc-backend-config-test
          /tmp/simplefoc-backend-config-test
